  tags: [amarnath]
  summary: >
    At dawn on 6 August 2002 a militant dressed as a local herder got through the security cordon at the Nunwan base camp, threw grenades
    and fired at pilgrims. Nine pilgrims were killed and 28 injured before he was shot dead. Deputy Prime Minister L.K. Advani blamed
    al-Mansuriyan, a new front of Lashkar-e-Taiba.

