  src: [de-op-gibraltar, tribune-op-gibraltar, idr-1965-valour]
  conf: confirmed
  hp: true
  tags: [war-1965]
  summary: >
    From the night of 5 August 1965 Pakistan sent armed infiltrators, many of them soldiers dressed as locals, across the ceasefire line
    through routes in Gurez, Tithwal, Uri, Poonch, Rajouri and Kargil. The plan was to start an uprising in the Valley. Local people did
    not rise and often reported the infiltrators to the authorities, and the operation failed.
  notes: Published estimates of the size of the infiltrating force differ widely and are not recorded here.

