    From around 20 February 1986 mobs in Anantnag district attacked Kashmiri Pandit homes, shops and temples, starting at Wanpoh and
    spreading to Bijbehara and other villages. Temples were desecrated and burnt and houses looted. The riots are widely seen as an early
    warning of the 1990 exodus.

