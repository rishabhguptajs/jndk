  summary: >
    On 13 April 1984, Baisakhi day, the Indian Army and Air Force began Operation Meghdoot and took the main passes of the Saltoro Ridge,
    Bilafond La and Sia La. The move pre-empted a Pakistani plan to occupy the heights, and India has held the Siachen glacier since.

