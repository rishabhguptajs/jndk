  tags: [war-1971, india-response]
  summary: >
    In December 1971 troops led by Major Chewang Rinchen of the Ladakh Scouts advanced about 22 km through mountains in winter, without
    artillery support. They retook more than 800 sq km held by Pakistan since 1948, including the villages of Turtuk, Chalunkha, Thang and
    Takshi.

