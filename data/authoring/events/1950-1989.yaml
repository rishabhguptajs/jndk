  tags: [hijacking]
  summary: >
    On 30 January 1971 two members of the National Liberation Front, Hashim Qureshi and his cousin, hijacked the Indian Airlines Fokker
    Friendship Ganga soon after take-off from Srinagar and forced it to land at Lahore. Passengers and crew were sent back to India, but
    the aircraft was destroyed on the ground in Lahore. India responded by banning Pakistani flights over its territory, which hampered
    Pakistan later that year.

