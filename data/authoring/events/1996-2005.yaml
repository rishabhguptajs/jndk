  cross_border: true
  tags: [outside-jk]
  summary: >
    On 13 December 2001 five armed men from Lashkar-e-Taiba and Jaish-e-Mohammed attacked the Parliament complex in New Delhi. Eight
    security personnel and a gardener were killed and all five attackers died. The attack led to a massive Indian military mobilisation on
    the border with Pakistan.
  notes: Outside J&K; included because it was carried out by Kashmir-focused groups. Placed at a generic point so it appears on the timeline only.

