  conf: confirmed
  hp: true
  tags: [kashmiri-pandits]
  summary: >
    On the night of 22 to 23 March 2003 Lashkar-e-Taiba militants in combat uniforms surrounded the Kashmiri Pandit homes in Nadimarg,
    lined up the residents and shot them. Twenty-four people were killed: 11 men, 11 women and two small boys. The High Court later
    ordered the stalled trial to resume.
  notes: Recorded in Pulwama district at the time. The current district is left blank until confirmed after the 2007 reorganisation.

