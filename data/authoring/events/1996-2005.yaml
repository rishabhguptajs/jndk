  conf: confirmed
  hp: true
  tags: [political-killing]
  summary: >
    Abdul Ghani Lone, a senior moderate leader of the Hurriyat Conference, was shot dead by gunmen in police uniform at a rally at the
    Idgah in Srinagar on 21 May 2002. The rally marked the anniversary of Mirwaiz Mohammad Farooq's killing, and the attack came a day
    before Prime Minister Vajpayee's visit to the Valley.
  notes: Other casualties of the attack are not recorded in the cited sources.

