  summary: >
    On 25 January 1990 gunmen in a car opened fire on Indian Air Force personnel waiting for transport at Rawalpora on the outskirts of
    Srinagar. Squadron Leader Ravi Khanna and three other airmen were killed and dozens injured. The CBI charged JKLF chief Yasin Malik
    and others, and in 2024 a surviving airman identified Malik in court as the main shooter.

