  tags: [kashmiri-pandits]
  summary: >
    Satish Tickoo, a young Kashmiri Pandit social worker, was shot at his home in Habba Kadal, Srinagar on 2 February 1990 and died in
    hospital. Former JKLF militant Farooq Ahmad Dar, known as Bitta Karate, is accused of the killing, and his family's plea to reopen the
    trial was heard in Srinagar courts in 2022.

