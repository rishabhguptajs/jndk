- id: 1990-01-19-pandit-exodus
  date: 1990-01-19
  end: 1990-03
  title: Exodus of Kashmiri Pandits from the Valley
  place: Srinagar and towns across the Kashmir Valley
  at: manual:kashmir-valley
  district: [null, null]
  region: Kashmir Valley
  cat: exodus
  tactic: displacement
  target: [civilians, minority_community]
  community: Kashmiri Pandit (Hindu)
  perp: []
  attr: not_applicable
  killed: { total: null }
  displaced: 90000-400000
  figures:
    loksabha-kp-migrants-324: { note: "44,684 Kashmiri migrant families, 1,54,712 persons, registered with the Relief and Rehabilitation Commissioner (Migrants), Jammu" }
    kashmirlife-64827-families: { note: "MHA: 64,827 Kashmiri Pandit families left the Valley in the early 1990s" }
    theprint-31-years-exile: { note: "Between three and four lakh Kashmiri Pandits displaced within months" }
    quint-kp-exodus-timeline: { note: "Kashmiri Pandit Sangharsh Samiti: 75,343 left in January 1990 and about 70,000 more by March" }
    wikipedia-kh-exodus: { note: "Summarises scholarly estimates of 90,000 to 150,000 leaving between January and March 1990 (reference work, not counted as an independent source)" }
  src: [theprint-31-years-exile, organiser-jan19-1990, tribune-acknowledge-exodus, kashmirlife-64827-families, loksabha-kp-migrants-324, quint-kp-exodus-timeline, wikipedia-kh-exodus]
  conf: disputed
  hp: true
  tags: [kashmiri-pandits, exodus]
  summary: >
    On the night of 19 January 1990 slogans against Kashmiri Pandits were broadcast from mosque loudspeakers and crowds gathered in the
    streets, after months of targeted killings and threats. Over the following weeks and months almost all Pandit families left the
    Valley for Jammu, Delhi and elsewhere, many living for years in camps. Official records count 64,827 families who left in the early
    1990s.
  notes: >
    Displacement is shown as a range because estimates differ widely and depend on the period counted. Scholarly estimates for January
    to March 1990 run from about 90,000 to 150,000; the Kashmiri Pandit Sangharsh Samiti counts about 145,000 by March; the Relief
    Commissioner in Jammu lists 1,54,712 registered persons; other published estimates reach three to four lakh.

