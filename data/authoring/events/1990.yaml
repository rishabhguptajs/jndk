  summary: >
    Militants abducted Kashmir University Vice Chancellor Mushir-ul-Haq and his secretary Abdul Gani on 6 April 1990, along with HMT
    general manager H.L. Khera, to force the release of jailed associates. The hostages were killed on 10 April. The CBI charged members
    of the Jammu and Kashmir Students Liberation Front, but they were acquitted and the Supreme Court upheld the acquittal.

