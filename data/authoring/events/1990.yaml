  summary: >
    Armed men took the Kashmiri poet Sarvanand Kaul Premi and his son from their home in Anantnag district on the night of 29 to 30 April
    1990. Their bodies were found days later with signs of torture. The State Investigation Agency reopened the case and in 2026 searched
    properties linked to a slain militant from Rajouri.

