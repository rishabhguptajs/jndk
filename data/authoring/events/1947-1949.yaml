  summary: >
    The 6th Jammu and Kashmir Infantry under Lt Col Sher Jung Thapa held Skardu fort for about six months against forces from Gilgit.
    Out of food and ammunition, the garrison surrendered on 14 August 1948. Soldiers and the refugees sheltering with them were then killed,
    and women in the garrison took their own lives. Thapa was taken prisoner.

