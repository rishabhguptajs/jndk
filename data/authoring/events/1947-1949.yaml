  tags: [war-1947]
  summary: >
    A UN-brokered ceasefire took effect at midnight on 1 January 1949. Pakistan was left in occupation of Mirpur, Muzaffarabad, parts of
    Poonch and the Gilgit region. The ceasefire line was fixed by the Karachi Agreement of July 1949.
  notes: The UN commission reported in August 1948 that regular Pakistani troops were inside the state, a material change in the situation.

