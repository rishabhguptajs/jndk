    The lashkars reached Baramulla on 26 October 1947 and spent days looting the town instead of pressing on to Srinagar. Raiders stormed
    St Joseph's Convent and its hospital, killing nuns, staff and patients. Survivors estimated that about 3,000 townspeople were killed.
    The delay gave India time to fly troops into Srinagar.
