    The 1947 war displaced 31,619 families from areas that came under Pakistani occupation, according to the Union government. Of these,
    26,319 families registered and settled in Jammu and Kashmir, and 5,300 moved to other parts of India. Many still await full
    rehabilitation.
  notes: Figures are in families, not persons, as stated in the Lok Sabha answer.
