- id: 1947-10-22-muzaffarabad-invasion
  date: 1947-10-22
  end: 1947-10-24
  title: Invasion of Muzaffarabad and killings at Domel
  place: Muzaffarabad and Domel
  at: town:Muzaffarabad
  district: [Muzaffarabad, Pakistan-occupied Jammu & Kashmir (PoJK)]
  region: PoJK
  cat: massacre
  tactic: armed_assault
  target: [civilians, minority_community]
  community: Hindu and Sikh
  perp: [pakistan-army, tribal-lashkars-1947]
  attr: state_actor
  killed: { total: null }
  injured: null
  abducted: null
  src: [ians-oct22-1947, pioneer-op-gulmarg, tribune-paradise-lost, ians-invasion-terrorism]
  conf: confirmed
  hp: true
  tags: [operation-gulmarg, war-1947]
  summary: >
    On 22 October 1947 tribal lashkars, armed, transported and led by Pakistan Army officers, crossed into Jammu and Kashmir and took Muzaffarabad
    within days. Hindu and Sikh residents and refugees were killed, their homes looted and burnt, and many women abducted. Men rounded up near
    Domel were shot and their bodies thrown into the river. India marks 22 October as a Black Day for the invasion.
  notes: >
    Death tolls for Muzaffarabad and Domel are not settled. One account cited here gives more than 1,000 killed at Domel alone; no single
    figure is recorded until a primary source is reviewed.

