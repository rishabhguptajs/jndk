  tags: [war-1947]
  summary: >
    Poonch, crowded with refugees, was surrounded by Pakistani forces from late November 1947. Under Brigadier Pritam Singh the garrison
    and residents built an airstrip in about a week, and supplies came in by air from December 1947 despite shelling. The siege was broken
    in November 1948 when a relief force linked up with the garrison.
  notes: Accounts give 20 or 21 November 1948 for the relief.

